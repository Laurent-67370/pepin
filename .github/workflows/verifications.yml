# Vérifications automatiques à chaque push et pull request
name: Vérifications

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rapide:
    name: Cohérence, serveur et déterminisme
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versions, monde du jour, nombre de mondes
        run: node tools/verifier-coherence.js
      - name: Tests du serveur de classement
        run: node --test tests/serveur.test.js
      - name: Déterminisme du jeu (même graine et mêmes entrées, même partie)
        run: node --test tests/determinisme.test.js
      - name: Enregistrement et rejeu des parties
        run: node --test tests/rejeu.test.js
      - name: Fantôme du meilleur temps
        run: node --test tests/fantome.test.js
      - name: Vérification des parties par le serveur
        run: node --test tests/verif.test.js
      - name: Sauvegarde (export, import) et partage du score
        run: node --test tests/sauvegarde.test.js
      - name: Cachettes et graines d'or (12 mondes)
        run: node --test tests/secrets.test.js
      - name: Scène de fin
        run: node --test tests/fin.test.js
      - name: Monde 13 (Jardin d'or)
        run: node --test tests/monde13.test.js
      - name: Aide, astuces en jeu et textes
        run: node --test tests/aide.test.js
      - name: Succès
        run: node --test tests/succes.test.js

  niveaux:
    name: Robot vérificateur des 13 mondes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Faisabilité des niveaux
        run: node tools/verifier-niveaux.js
