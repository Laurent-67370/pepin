# Vérifications automatiques à chaque push et pull request
name: Vérifications

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rapide:
    name: Cohérence et serveur
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versions, monde du jour, nombre de mondes
        run: node tools/verifier-coherence.js
      - name: Tests du serveur de classement
        run: node --test tests/serveur.test.js

  niveaux:
    name: Robot vérificateur des 12 mondes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Faisabilité des niveaux
        run: node tools/verifier-niveaux.js
