server {
    listen 80;
    server_name pepin-api.lhusser.fr;
    location / {
        proxy_pass http://127.0.0.1:3215;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 300k; # la partie jointe au score pour vérification
    }
}
